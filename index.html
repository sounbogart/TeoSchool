<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TeoSchool — математика для 7–8 классов</title>
<meta name="description" content="TeoSchool: основа сайта с примерами учебных материалов по математике для 7–8 классов.">
<style>
:root{
  --bg:#f5f6fa;--card:#fff;--text:#1d2433;--muted:#6b7385;--accent:#3b6cf6;--accent-soft:#e6ecff;
  --line:#e3e6ee;--ok:#1f9d55;--warn:#d9822b;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#12151c;--card:#1b202b;--text:#e8ebf2;--muted:#9aa3b5;--accent:#6c93ff;--accent-soft:#232c45;--line:#2a3140;--ok:#47c27c;--warn:#f0a14e}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
body{padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
header button{border:0;background:var(--accent-soft);color:var(--accent);width:38px;height:38px;border-radius:12px;font-size:20px;cursor:pointer}
header button[hidden]{display:none}
header h1{font-size:18px;margin:0;flex:1}
main{max-width:720px;margin:0 auto;padding:16px}
.grid{display:grid;gap:12px}
.doc + .grid{margin-top:16px}
button:focus-visible, summary:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;text-align:left;font:inherit;color:inherit;cursor:pointer;width:100%}
.tile:active{transform:scale(.99)}
.tile b{display:block;font-size:19px;margin-bottom:2px}
.tile span{color:var(--muted);font-size:14px}
.big{font-size:34px;line-height:1;margin-bottom:8px;display:block}
.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:16px}
.tabs button{flex:1;border:0;background:none;color:var(--muted);padding:10px 4px;border-radius:10px;font:inherit;font-size:14px;cursor:pointer}
.tabs button.on{background:var(--accent);color:#fff}
.list{display:grid;gap:10px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;width:100%;text-align:left;font:inherit;color:inherit}
.item small{color:var(--muted);display:block}
.badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:20px;background:var(--accent-soft);color:var(--accent);margin-bottom:4px}
.badge.hw{background:#fff1e0;color:var(--warn)}
@media (prefers-color-scheme:dark){.badge.hw{background:#3a2c1a}}
.doc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.doc h2{margin-top:0;font-size:21px}
.doc h3{font-size:17px;margin:18px 0 6px}
.doc p{margin:8px 0}
.rule{background:var(--accent-soft);border-left:4px solid var(--accent);border-radius:8px;padding:10px 12px;margin:12px 0}
.ex{background:var(--bg);border-radius:8px;padding:10px 12px;margin:10px 0}
.doc ol,.doc ul{padding-left:22px}
.doc li{margin:6px 0}
.tools{display:flex;gap:8px;justify-content:flex-end;margin-bottom:10px}
.tools button{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:6px 12px;font:inherit;cursor:pointer}
details{margin:10px 0;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
summary{cursor:pointer;color:var(--accent)}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.var{font-weight:600;margin:16px 0 4px}
.nav2{display:flex;justify-content:space-between;gap:10px;margin-top:14px}
.nav2 button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:12px;font:inherit;cursor:pointer}
.nav2 button[disabled]{opacity:.4}
</style>
</head>
<body>
<header>
  <button id="back" hidden aria-label="Назад">←</button>
  <h1 id="title">TeoSchool</h1>
</header>
<main id="app"></main>

<script>
/* =====================================================================
   ВСЁ СОДЕРЖИМОЕ САЙТА — ЗДЕСЬ. Меняйте тексты, добавляйте новые записи.
   Каждый предмет: textbook (параграфы), homework (домашки), tests (самостоятельные).
   В тексте можно использовать HTML: <p>, <h3>, <ol>, <ul>, <b>,
   <div class="rule">правило</div>, <div class="ex">пример</div>,
   <details><summary>Ответ</summary>…</details>.
   Ниже стоят ПРИМЕРЫ — замените их своими материалами.
   ===================================================================== */
const DATA = {
  "7": {
    title: "7 класс",
    subjects: [
      {
        id: "alg7", name: "Алгебра", icon: "➕",
        textbook: [
          { title: "§1. Числовые и буквенные выражения", html: `
            <h2>Числовые и буквенные выражения</h2>
            <p><b>Числовое выражение</b> — это числа, соединённые знаками действий. Например: 3 + 5·2.</p>
            <p><b>Буквенное выражение</b> — выражение, в котором есть буквы (переменные). Например: 2a + 7.</p>
            <div class="rule">Значение выражения — число, которое получится, если вместо букв подставить числа и выполнить действия.</div>
            <div class="ex"><b>Пример.</b> Найдём значение 2a + 7 при a = 4.<br>2·4 + 7 = 8 + 7 = 15.</div>
            <h3>Проверь себя</h3>
            <ol><li>Найди значение 3x − 2 при x = 5.</li><li>Запиши выражение: «число b увеличили на 6».</li></ol>
            <details><summary>Ответы</summary>1) 13; 2) b + 6.</details>` },
          { title: "§2. Уравнение и его корень", html: `
            <h2>Уравнение и его корень</h2>
            <p><b>Уравнение</b> — равенство с неизвестным числом, которое нужно найти.</p>
            <div class="rule">Корень уравнения — число, при подстановке которого получается верное равенство.</div>
            <div class="ex"><b>Пример.</b> x + 3 = 10. Корень: x = 7, потому что 7 + 3 = 10.</div>` }
        ],
        homework: [
          { date: "06.10", title: "Домашнее задание на 06.10", html: `
            <p>Прочитать §1.</p>
            <ol><li>Найди значение выражения 4a − 3 при a = 6.</li><li>Запиши выражение: «число m уменьшили на 9».</li></ol>` }
        ],
        tests: [
          { title: "Самостоятельная работа №1. Выражения", variants: [
            { name: "Вариант 1", html: `<ol><li>Найди значение 2x + 5 при x = 3.</li><li>Найди значение 6 − y при y = 2.</li></ol>` },
            { name: "Вариант 2", html: `<ol><li>Найди значение 3x + 4 при x = 2.</li><li>Найди значение 9 − y при y = 5.</li></ol>` }
          ] }
        ]
      },
      {
        id: "geom7", name: "Геометрия", icon: "📐",
        textbook: [
          { title: "§1. Точка, прямая, отрезок", html: `<h2>Точка, прямая, отрезок</h2><p><b>Точка</b> — самая простая фигура, её обозначают большой буквой: A, B.</p><p><b>Отрезок</b> — часть прямой между двумя точками.</p>` }
        ],
        homework: [], tests: []
      },
      {
        id: "prob7", name: "Вероятность и статистика", icon: "🎲",
        textbook: [
          { title: "§1. Что такое данные", html: `<h2>Что такое данные</h2><p>Данные — это сведения, которые мы собираем и записываем: оценки, рост, температура. Их удобно записывать в таблицу.</p>` }
        ],
        homework: [], tests: []
      }
    ]
  },
  "8": {
    title: "8 класс",
    subjects: [
      {
        id: "alg8", name: "Алгебра", icon: "➕",
        textbook: [
          { title: "§1. Квадратный корень", html: `
            <h2>Квадратный корень</h2>
            <p><b>Квадратный корень</b> из числа a — это число, квадрат которого равен a.</p>
            <div class="rule">√9 = 3, потому что 3² = 9.</div>` }
        ],
        homework: [], tests: []
      },
      {
        id: "geom8", name: "Геометрия", icon: "📐",
        textbook: [
          { title: "§1. Четырёхугольники", html: `<h2>Четырёхугольники</h2><p>Четырёхугольник — фигура с четырьмя сторонами и четырьмя вершинами.</p>` }
        ],
        homework: [], tests: []
      },
      {
        id: "prob8", name: "Вероятность и статистика", icon: "🎲",
        textbook: [], homework: [], tests: []
      }
    ]
  }
};
/* ===================== конец блока с содержимым ===================== */

const app = document.getElementById('app');
const titleEl = document.getElementById('title');
const backBtn = document.getElementById('back');
let stack = [];            // история экранов
let fontSize = Number(safeGet('fs')) || 17;

function safeGet(k){ try{ return localStorage.getItem(k) }catch(e){ return null } }
function safeSet(k,v){ try{ localStorage.setItem(k,v) }catch(e){} }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])) }

function go(screen){ stack.push(screen); render(); window.scrollTo(0,0) }
function back(){ stack.pop(); render(); window.scrollTo(0,0) }
backBtn.onclick = back;

function render(){
  const s = stack[stack.length-1] || {t:'home'};
  backBtn.hidden = stack.length === 0;
  app.innerHTML = '';
  if (s.t==='home') return home();
  if (s.t==='class') return classScreen(s);
  if (s.t==='subject') return subjectScreen(s);
  if (s.t==='doc') return docScreen(s);
}

function home(){
  titleEl.textContent = 'TeoSchool';
  const intro = el('section', 'doc');
  intro.innerHTML = '<h2>Математика для 7–8 классов</h2><p>Алгебра, геометрия, вероятность и статистика.</p><p>Это основа сайта TeoSchool. Ниже сохранены примеры учебных материалов; содержание разделов ещё предстоит подготовить.</p>';
  app.appendChild(intro);
  const g = el('div','grid');
  Object.keys(DATA).forEach(k=>{
    const c = DATA[k];
    const b = el('button','tile');
    b.innerHTML = `<span class="big">${k==='7'?'7️⃣':'8️⃣'}</span><b>${esc(c.title)}</b><span>${c.subjects.map(x=>esc(x.name)).join(' · ')}</span>`;
    b.onclick = ()=>go({t:'class',k});
    g.appendChild(b);
  });
  app.appendChild(g);
}

function classScreen(s){
  const c = DATA[s.k];
  titleEl.textContent = c.title;
  const g = el('div','grid');
  c.subjects.forEach(sub=>{
    const b = el('button','tile');
    b.innerHTML = `<span class="big">${sub.icon||'📘'}</span><b>${esc(sub.name)}</b><span>Учебник · Домашние · Самостоятельные</span>`;
    b.onclick = ()=>go({t:'subject',k:s.k,id:sub.id,tab:'textbook'});
    g.appendChild(b);
  });
  app.appendChild(g);
}

function getSub(s){ return DATA[s.k].subjects.find(x=>x.id===s.id) }

function subjectScreen(s){
  const sub = getSub(s);
  titleEl.textContent = `${sub.name}, ${s.k} кл.`;
  const tabs = el('div','tabs');
  [['textbook','Учебник'],['homework','Домашние'],['tests','Самостоятельные']].forEach(([id,name])=>{
    const b = el('button', s.tab===id?'on':''); b.textContent = name;
    b.onclick = ()=>{ s.tab = id; render() };
    tabs.appendChild(b);
  });
  app.appendChild(tabs);

  const items = sub[s.tab] || [];
  if (!items.length){
    app.appendChild(Object.assign(el('div','empty'),{textContent:'В этом разделе пока нет материалов.'}));
    return;
  }
  const list = el('div','list');
  items.forEach((it,i)=>{
    const b = el('button','item');
    const badge = s.tab==='homework' ? `<span class="badge hw">${esc(it.date||'')}</span>` :
                  s.tab==='tests' ? `<span class="badge">${it.variants.length} вар.</span>` : '';
    b.innerHTML = `${badge}<b>${esc(it.title)}</b>`;
    b.onclick = ()=>go({t:'doc',k:s.k,id:s.id,tab:s.tab,i});
    list.appendChild(b);
  });
  app.appendChild(list);
}

function docScreen(s){
  const sub = getSub(s);
  const items = sub[s.tab];
  const it = items[s.i];
  titleEl.textContent = s.tab==='textbook' ? 'Учебник' : s.tab==='homework' ? 'Домашнее задание' : 'Самостоятельная';

  if (s.tab==='textbook'){
    const tools = el('div','tools');
    const m = el('button'); m.textContent='А−';
    const p = el('button'); p.textContent='А+';
    m.onclick=()=>{fontSize=Math.max(14,fontSize-1);safeSet('fs',fontSize);apply()};
    p.onclick=()=>{fontSize=Math.min(26,fontSize+1);safeSet('fs',fontSize);apply()};
    tools.append(m,p); app.appendChild(tools);
  }
  const doc = el('div','doc'); doc.id='doc';
  if (s.tab==='tests'){
    doc.innerHTML = `<h2>${esc(it.title)}</h2>` + it.variants.map(v=>`<div class="var">${esc(v.name)}</div>${v.html}`).join('');
  } else {
    doc.innerHTML = it.html;
  }
  app.appendChild(doc);
  apply();

  const nav = el('div','nav2');
  const prev = el('button'); prev.textContent='← Предыдущий'; prev.disabled = s.i===0;
  const next = el('button'); next.textContent='Следующий →'; next.disabled = s.i===items.length-1;
  prev.onclick=()=>{ stack[stack.length-1]={...s,i:s.i-1}; render(); window.scrollTo(0,0) };
  next.onclick=()=>{ stack[stack.length-1]={...s,i:s.i+1}; render(); window.scrollTo(0,0) };
  nav.append(prev,next); app.appendChild(nav);
}

function apply(){ const d=document.getElementById('doc'); if(d) d.style.fontSize=fontSize+'px' }
function el(tag,cls){ const e=document.createElement(tag); if(cls) e.className=cls; return e }

render();
</script>
</body>
</html>
